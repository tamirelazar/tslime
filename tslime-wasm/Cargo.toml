[package]
name = "tslime-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of tslime with WebGL2 rendering"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlTexture",
    "WebGlUniformLocation",
]

[dependencies.tslime]
path = ".."
default-features = false
features = []

# Test-only: unifies with the [dependencies.tslime] entry above to enable the
# `terminal` feature (and thus `tslime::app::headless_ansi_frame`) for
# `cargo test -p tslime-wasm`, without pulling it into the wasm/cdylib build
# (dev-dependency features only apply to test/bench/example builds).
[dev-dependencies.tslime]
path = ".."
features = ["terminal"]

# Recent rustc/wasm-bindgen emit post-MVP ops (bulk-memory `memory.copy`,
# sign-extension, …) in the generated glue. The bundled `wasm-opt` validates
# with those features OFF by default and aborts; enable them all so `-O`
# succeeds. Every feature used here is baseline in the browsers the site targets.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--all-features']

